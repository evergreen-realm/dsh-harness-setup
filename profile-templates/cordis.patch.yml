# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: detailed
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: ollama-kimi
    fetchProvider: ollama-fetch
- id: tool-web
  name: "@deepseek-ai/dsh-tool-web"
  config:
    fetch: true
    searchTimeoutMs: 90000
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      ollama:
        displayName: "Ollama Cloud Pro"
        apiKeyEnv: OLLAMA_API_KEY
        api: openai-completions
        baseURL: https://ollama.com/v1
        retryPolicy:
          mode: normal
          maxRetries: 3
        models:
          - id: deepseek-v4.1-flash
            name: "DeepSeek V4.1 Flash (Fallback #1)"
            contextWindow: 1000000
          - id: glm-5.3-flash
            name: "GLM 5.3 Flash (Fallback #2)"
            contextWindow: 1000000
          - id: minimax-m3.1-flash
            name: "MiniMax M3.1 Flash (Fallback #3)"
            contextWindow: 976000
          - id: kimi-k2.7-code
            name: "Kimi K2.7 Code (Research Synthesis)"
            contextWindow: 256000
          - id: kimi-k2.6
            name: "Kimi K2.6 (Cached Swarm / Design)"
            contextWindow: 256000
